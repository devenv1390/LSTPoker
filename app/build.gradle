plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
}

// 版本末位与 versionCode 取"距项目起点的分钟数"，随时间单调自增，无需手动改版本
def epochCal = Calendar.getInstance(TimeZone.getTimeZone("Asia/Shanghai"))
epochCal.set(2026, Calendar.NOVEMBER, 17, 0, 0, 0)
epochCal.set(Calendar.MILLISECOND, 0)
def autoVersion = Math.max(1L, Math.floorDiv(System.currentTimeMillis() - epochCal.timeInMillis, 60000L))
def buildStamp = new Date().format("yyyyMMdd-HHmm", TimeZone.getTimeZone("Asia/Shanghai"))
def releaseStorePath = findProperty('POKER_RELEASE_STORE_FILE') ?: System.getenv('POKER_RELEASE_STORE_FILE') ?:
    "${System.getProperty('user.home')}/.android/keystores/pokerdemo-release.jks"
def releaseStorePassword = findProperty('POKER_RELEASE_STORE_PASSWORD') ?: System.getenv('POKER_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = findProperty('POKER_RELEASE_KEY_ALIAS') ?: System.getenv('POKER_RELEASE_KEY_ALIAS') ?: 'pokerdemo-release'
def releaseKeyPassword = findProperty('POKER_RELEASE_KEY_PASSWORD') ?: System.getenv('POKER_RELEASE_KEY_PASSWORD')
def releaseSigningReady = file(releaseStorePath).exists() && releaseStorePassword && releaseKeyPassword

android {
    namespace 'com.aniapp.pokerdemo'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.aniapp.pokerdemo"
        minSdk 28
        targetSdk 36
        versionCode autoVersion as int
        versionName "1.0.${autoVersion}"
        resValue "string", "app_version", "v1.0.${autoVersion}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // 正式证书存放在用户目录；密码通过用户级 Gradle 配置或环境变量注入，不写入项目。
            if (releaseSigningReady) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "LSTPoker-v${variant.versionName}-${variant.buildType.name}-${buildStamp}.apk"
        }
    }
    tasks.configureEach { task ->
        if (task.name in ['validateSigningRelease', 'validateReleaseSigning', 'assembleRelease', 'bundleRelease']) {
            doFirst {
                if (!releaseSigningReady) {
                    throw new GradleException('Release 签名未配置：请设置 POKER_RELEASE_STORE_FILE、POKER_RELEASE_STORE_PASSWORD、POKER_RELEASE_KEY_PASSWORD，并确保 keystore 存在。')
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation project(':shared')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.serialization.json
    implementation libs.ktor.client.core
    implementation libs.ktor.client.cio
    implementation libs.androidx.activity.compose
    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}